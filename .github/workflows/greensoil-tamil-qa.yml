name: GreenSoil JARVIS Tamil Feature QA
on:
  workflow_dispatch:
  push:
    branches: [feature/greensoil-tamil-voice-translator]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: greensoil-jarvis-tamil-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
