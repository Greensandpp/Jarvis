name: GreenSoil JARVIS five-mode AIRA staging

on:
  push:
    branches:
      - staging/aira-five-modes-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Toolchain versions
        run: flutter --version && java -version
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze whole project (errors and warnings are fatal)
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt
      - name: Full test suite (machine-readable log kept as evidence)
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.txt
      - name: Debug staging APK
        run: flutter build apk --debug
      - name: Release QA APK (visualrelease)
        run: flutter build apk --release
      - name: Identity, signature, alignment, permissions, SHA256
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p out evidence
          cp build/app/outputs/flutter-apk/app-debug.apk out/GreenSoil-JARVIS-5MODE-STAGING-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk out/GreenSoil-JARVIS-5MODE-STAGING-visualrelease.apk
          for a in out/*.apk; do
            n=$(basename "$a" .apk)
            "$TOOLS/aapt" dump badging "$a" > "evidence/$n-badging.txt"
            "$TOOLS/aapt" dump permissions "$a" > "evidence/$n-permissions.txt"
            "$TOOLS/apksigner" verify --verbose --print-certs "$a" > "evidence/$n-signing.txt"
            "$TOOLS/zipalign" -c -P 16 4 "$a" > "evidence/$n-zipalign.txt" && echo "zipalign16 PASS" >> "evidence/$n-zipalign.txt"
          done
          for f in evidence/*-permissions.txt; do echo "== $f"; cat "$f"; done
          for f in evidence/*-signing.txt; do echo "== $f"; grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" "$f"; done
          for f in evidence/*-badging.txt; do echo "== $f"; grep -E "^package:|sdkVersion|targetSdkVersion|native-code|application-label:" "$f"; done
          grep -q "package: name='com.greensoil.jarvis.tamiltest.visualstaging'" evidence/GreenSoil-JARVIS-5MODE-STAGING-debug-badging.txt
          grep -q "package: name='com.greensoil.jarvis.tamiltest.visualrelease'" evidence/GreenSoil-JARVIS-5MODE-STAGING-visualrelease-badging.txt
          python3 scripts/check_apk_elf_16kb.py out/GreenSoil-JARVIS-5MODE-STAGING-visualrelease.apk evidence/visualrelease-elf-16kb.json
      - name: Minimal-permission variants (visualsafe, voicesafe)
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for v in visualsafe voicesafe; do
            git checkout -- android
            python3 scripts/make_safe_mobile_staging.py --variant "$v"
            flutter build apk --release
            a="out/GreenSoil-JARVIS-5MODE-STAGING-$v.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "$a"
            "$TOOLS/aapt" dump badging "$a" > "evidence/$v-badging.txt"
            "$TOOLS/aapt" dump permissions "$a" | tee "evidence/$v-permissions.txt"
            "$TOOLS/apksigner" verify --verbose --print-certs "$a" > "evidence/$v-signing.txt"
            grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" "evidence/$v-signing.txt"
            grep -q "package: name='com.greensoil.jarvis.tamiltest.$v'" "evidence/$v-badging.txt"
            # Fail if any sensitive permission survived manifest merging.
            if grep -E "QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|READ_CONTACTS|WRITE_SETTINGS|PACKAGE_USAGE_STATS|CAMERA|BIND_ACCESSIBILITY|REQUEST_DELETE_PACKAGES|REQUEST_INSTALL_PACKAGES|shizuku" "evidence/$v-permissions.txt"; then
              echo "::error::sensitive permission present in $v"; exit 1
            fi
          done
          git checkout -- android
          (cd out && sha256sum *.apk) | tee evidence/SHA256SUMS.txt
          echo "commit=${GITHUB_SHA}" > evidence/PROVENANCE.txt
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> evidence/PROVENANCE.txt
          echo "signing=CI-ephemeral Android debug keystore (STAGING ONLY, not the owner's release key)" >> evidence/PROVENANCE.txt
          cp analyze.txt flutter-test.txt evidence/
      - name: Upload staging APKs (NOT an update to installed JARVIS)
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-5MODE-AIRA-STAGING-APKS-NOT-UPDATE
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-5MODE-BUILD-EVIDENCE
          path: |
            evidence/
            analyze.txt
            flutter-test.txt
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk for AVD
        shell: bash
        run: |
          for d in /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk; do
            if [[ -d "$d" ]]; then sudo rm -rf "$d"; fi
          done
          df -h "$HOME"
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-5MODE-AIRA-STAGING-APKS-NOT-UPDATE
          path: apks
      - name: Install, launch, screenshot every mode (Android ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 3
          script: bash scripts/emulator_smoke.sh emulator-evidence-api${{ matrix.api-level }} apks/GreenSoil-JARVIS-5MODE-STAGING-debug.apk apks/GreenSoil-JARVIS-5MODE-STAGING-visualrelease.apk apks/GreenSoil-JARVIS-5MODE-STAGING-visualsafe.apk apks/GreenSoil-JARVIS-5MODE-STAGING-voicesafe.apk
      - name: Contact sheet of real emulator screenshots (printed for review)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          D=emulator-evidence-api${{ matrix.api-level }}
          cd "$D" || exit 0
          ls -la
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pillow || sudo apt-get install -y -qq python3-pil
          python3 "$GITHUB_WORKSPACE/scripts/contact_sheet.py" .
          grep -h "TOTAL" meminfo-aira.txt 2>/dev/null | head -2 || true
          grep -hE "Total frames rendered|Janky frames|50th percentile|90th percentile" gfxinfo-aira.txt 2>/dev/null | head -5 || true
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-5MODE-EMULATOR-EVIDENCE-API${{ matrix.api-level }}
          path: emulator-evidence-api${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14
