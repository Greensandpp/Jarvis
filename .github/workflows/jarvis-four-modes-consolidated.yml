name: GreenSoil JARVIS four-mode consolidated staging

on:
  push:
    branches:
      - feature/jarvis-four-modes-consolidated-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze visual integration
        run: flutter analyze lib/widgets/jarvis_visual_mode_host.dart lib/screens/home/home_screen.dart
      - name: Existing tests
        run: flutter test
      - name: Compile isolated Android debug APK
        run: flutter build apk --debug
      - name: Capture package, certificate, and 16KB alignment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$TOOLS/zipalign" -c -v -P 16 4 "$APK" | tee apk-alignment.txt
          sha256sum "$APK" | tee apk-sha256.txt
          grep -q "package: name='com.greensoil.jarvis.tamiltest.visualstaging'" apk-badging.txt
      - name: Publish install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4MODE-INSTALL-EVIDENCE
          path: |
            apk-badging.txt
            apk-signing.txt
            apk-alignment.txt
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish isolated debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CONSOLIDATED-4-MODE-STAGING-NOT-UPDATE
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build distinct release-mode phone QA APK
        run: flutter build apk --release
      - name: Validate release-mode package and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee release-apk-badging.txt
          grep -q "package: name='com.greensoil.jarvis.tamiltest.visualrelease'" release-apk-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee release-apk-signing.txt
          "$TOOLS/zipalign" -c -v -P 16 4 "$APK" | tee release-apk-alignment.txt
          sha256sum "$APK" | tee release-apk-sha256.txt
      - name: Verify ARM64 native ELF 16 KB page alignment
        shell: bash
        run: |
          python3 scripts/check_apk_elf_16kb.py build/app/outputs/flutter-apk/app-release.apk release-elf-16kb-report.json
      - name: Publish distinct release-mode QA APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4MODE-ARM64-RELEASE-STAGING-NOT-UPDATE
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-apk-badging.txt
            release-apk-signing.txt
            release-apk-alignment.txt
            release-apk-sha256.txt
            release-elf-16kb-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare isolated minimal-permission iQOO install probe
        run: python3 scripts/make_safe_mobile_staging.py
      - name: Build visual-safe release candidate
        run: flutter build apk --release
      - name: Verify isolated visual-safe identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump badging "$APK" | tee visualsafe-badging.txt
          grep -q "package: name='com.greensoil.jarvis.tamiltest.visualsafe'" visualsafe-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > visualsafe-signing.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee visualsafe-permissions.txt
          sha256sum "$APK" > visualsafe-sha256.txt
      - name: Publish isolated minimal-permission QA variant
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4MODE-VISUALSAFE-DIAGNOSTIC-NOT-RELEASE
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            visualsafe-badging.txt
            visualsafe-signing.txt
            visualsafe-permissions.txt
            visualsafe-sha256.txt
          if-no-files-found: error
          retention-days: 7

  android16-clean-install:
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Reclaim disk for Android 16 AVD
        shell: bash
        run: |
          set -euo pipefail
          df -h "$HOME"
          for d in /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk; do
            if [[ -d "$d" ]]; then sudo rm -rf "$d"; fi
          done
          df -h "$HOME"
      - name: Enable KVM for x86_64 emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::Runner lacks /dev/kvm: x86_64 API36 boot is not reliable without acceleration"
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-CONSOLIDATED-4-MODE-STAGING-NOT-UPDATE
          path: downloaded-apk
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-4MODE-ARM64-RELEASE-STAGING-NOT-UPDATE
          path: downloaded-release
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-4MODE-VISUALSAFE-DIAGNOSTIC-NOT-RELEASE
          path: downloaded-safe
      - name: Fresh APK install on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 256M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 2
          script: |
            find downloaded-apk -maxdepth 3 -type f -print
            test -s downloaded-apk/app-debug.apk
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb install -t downloaded-apk/app-debug.apk > android16-install.txt 2>&1
            cat android16-install.txt
            grep -q 'Success' android16-install.txt
            adb shell pm path com.greensoil.jarvis.tamiltest.visualstaging
            find downloaded-release -maxdepth 9 -type f -print
            test -s "$(find downloaded-release -type f -name 'app-release.apk' -print -quit)"
            adb install "$(find downloaded-release -type f -name 'app-release.apk' -print -quit)"
            adb shell pm path com.greensoil.jarvis.tamiltest.visualrelease
            test -s "$(find downloaded-safe -type f -name 'app-release.apk' -print -quit)"
            adb install "$(find downloaded-safe -type f -name 'app-release.apk' -print -quit)"
            adb shell pm path com.greensoil.jarvis.tamiltest.visualsafe
      - name: Publish install result if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ANDROID16-ADB-INSTALL-RESULT
          path: android16-install.txt
          if-no-files-found: warn
          retention-days: 7
