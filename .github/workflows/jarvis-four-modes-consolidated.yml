name: GreenSoil JARVIS four-mode consolidated staging

on:
  push:
    branches:
      - feature/jarvis-four-modes-consolidated-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Analyze visual integration
        run: flutter analyze lib/widgets/jarvis_visual_mode_host.dart lib/screens/home/home_screen.dart
      - name: Existing tests
        run: flutter test
      - name: Compile isolated Android debug APK
        run: flutter build apk --debug
      - name: Publish isolated debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CONSOLIDATED-4-MODE-STAGING-NOT-UPDATE
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
