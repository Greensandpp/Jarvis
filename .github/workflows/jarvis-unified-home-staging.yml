name: GreenSoil JARVIS unified home staging QA
on:
  push:
    branches:
      - feature/aira-unified-home-dock-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-safe-unified-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze changed project
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter regression suite
        run: flutter test --reporter expanded
      - name: Generate minimal-permission voice-safe staging
        run: |
          python3 scripts/make_safe_mobile_staging.py --variant voicesafe
          flutter build apk --release
      - name: Verify signed APK identity and permission guard
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > signing.txt
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          "$TOOLS/aapt" dump permissions "$APK" > permissions.txt
          grep -q "package: name='com.greensoil.jarvis.tamiltest.voicesafe'" badging.txt
          if grep -E "QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|READ_CONTACTS|WRITE_SETTINGS|PACKAGE_USAGE_STATS|CAMERA|REQUEST_INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES" permissions.txt; then
            echo "Unsafe permission in voice-safe staging"; exit 1
          fi
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          mkdir -p out
          cp "$APK" out/GreenSoil-JARVIS-UNIFIED-HOME-voicesafe-NOT-UPDATE.apk
      - name: Upload isolated signed staging APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-UNIFIED-HOME-VOICESAFE-NOT-UPDATE
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-UNIFIED-HOME-CI-EVIDENCE
          path: |
            signing.txt
            badging.txt
            permissions.txt
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
