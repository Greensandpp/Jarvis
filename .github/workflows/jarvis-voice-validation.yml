name: JARVIS Voice P0 Validation

on:
  push:
    branches:
      - fix/jarvis-voice-single-owner-20261121
  pull_request:
    branches:
      - fix/jarvis-final-ui-voice-security-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart analyzer
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build development APK
        run: flutter build apk --debug
      - name: Upload DEVELOPMENT APK (not release)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-p0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
