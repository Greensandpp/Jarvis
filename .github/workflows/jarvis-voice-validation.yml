name: JARVIS Voice P0 Validation

on:
  push:
    branches:
      - fix/jarvis-voice-single-owner-20261121
  pull_request:
    branches:
      - fix/jarvis-final-ui-voice-security-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart analyzer
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build Standard development APK
        run: flutter build apk --debug --flavor standard
      - name: Verify Standard APK output
        run: |
          find build/app/outputs -type f -name '*.apk' -print
          test -f build/app/outputs/flutter-apk/app-standard-debug.apk
      - name: Upload Standard DEVELOPMENT APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-p0-standard-debug
          path: build/app/outputs/flutter-apk/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build Full Control development APK
        run: flutter build apk --debug --flavor full
      - name: Verify Full APK output
        run: |
          find build/app/outputs -type f -name '*.apk' -print
          test -f build/app/outputs/flutter-apk/app-full-debug.apk
      - name: Upload Full Control DEVELOPMENT APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-p0-full-debug
          path: build/app/outputs/flutter-apk/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7
