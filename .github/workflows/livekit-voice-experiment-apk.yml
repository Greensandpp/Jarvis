name: LiveKit experimental Android APK compile

on:
  push:
    branches:
      - experiment/livekit-voice-butler-20261121
    paths:
      - 'experiments/livekit_voice_butler/flutter/**'
      - '.github/workflows/livekit-voice-experiment-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-lab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-apk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: experiments/livekit_voice_butler/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate disposable isolated Android scaffold
        run: flutter create --platforms=android --project-name greensoil_livekit_voice_experiment --org com.greensoil.experiment .
      - name: Remove generated starter test and missing default lint preset
        run: |
          rm -f test/widget_test.dart analysis_options.yaml
      - name: Add microphone, networking and audio permissions to generated manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          t=p.read_text()
          permissions=[
            "android.permission.INTERNET",
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.BLUETOOTH_CONNECT",
          ]
          header="".join(f'    <uses-permission android:name="{perm}" />\n' for perm in permissions)
          t=t.replace("<application",header+"    <application",1)
          p.write_text(t)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze standalone Flutter app
        run: flutter analyze
      - name: Run Flutter unit tests
        run: flutter test
      - name: Compile debug APK locally within CI (no artifact publication)
        run: flutter build apk --debug --no-pub
      - name: Verify APK and report size only
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
      # The repository is public. Deliberately DO NOT upload an APK artifact.
      # Once the build passes, a private distribution method is required.
