name: LiveKit voice experiment tests

on:
  push:
    branches:
      - experiment/livekit-voice-butler-20261121
    paths:
      - 'experiments/livekit_voice_butler/**'
      - '.github/workflows/livekit-voice-experiment-tests.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: livekit-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual staging container without credentials
        run: docker build -t gs-voice-staging-smoke -f experiments/livekit_voice_butler/Dockerfile .
      - name: Check default-off HTTP and mounted-volume privilege drop
        run: |
          docker volume create gs-voice-smoke-data
          docker run -d --name gs-voice-smoke -p 127.0.0.1:18080:8080 --mount source=gs-voice-smoke-data,target=/data -e GS_VOICE_ROLE=token -e PORT=8080 -e FORWARDED_ALLOW_IPS=127.0.0.1 gs-voice-staging-smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/voice-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; d=json.load(open("/tmp/voice-health.json")); assert d["live_voice_verified"] is False; assert d["issuance_enabled"] is False'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18080/api/livekit-token)" = 503
          docker exec gs-voice-smoke awk '/^Uid:/{if ($2 != 10001) exit 1; found=1} END{if(!found) exit 1}' /proc/1/status
          docker exec --user 10001 gs-voice-smoke python -m unittest test_sdk_integration.SDKTests.test_native_sdk_initializes_in_spawned_child
      - name: Remove disposable smoke container
        if: always()
        run: docker rm -f gs-voice-smoke || true

  python-state-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run isolated Python gate tests
        # SDK integration tests instantiate real SDK objects; never call a provider.
        env:
          LIVEKIT_URL: ''
          GEMINI_API_KEY: ''
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -r experiments/livekit_voice_butler/requirements-agent.txt -r experiments/livekit_voice_butler/requirements-token.txt
          python -m unittest discover -s experiments/livekit_voice_butler -p 'test_*.py' -v
          python -m pip_audit --local

  flutter-voice-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/livekit_voice_butler/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve experimental package dependencies
        run: flutter pub get
      - name: Static analysis of experiment
        run: flutter analyze
      - name: Run all experimental Flutter regression tests
        run: flutter test --reporter expanded
