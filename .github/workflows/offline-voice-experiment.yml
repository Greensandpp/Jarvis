name: Phone offline voice experiment
on:
  push:
    branches: [experiment/phone-offline-voice-20261121]
    paths:
      - 'experiments/offline_voice/**'
      - '.github/workflows/offline-voice-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  existing-voice-regressions:
    uses: ./.github/workflows/livekit-voice-experiment-tests.yml
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/offline_voice
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/test_android_scaffold.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Compile actual native local model smoke
        run: dart compile exe tool/local_model_smoke.dart -o /tmp/local-model-smoke
      - name: Download and verify pinned open model for actual inference
        run: python3 tool/download_model.py /tmp/qwen.gguf
      - name: Deny network sockets and run actual model inference
        run: |
          gcc -shared -fPIC -o /tmp/libdeny-net.so tool/deny_network.c -ldl
          LD_PRELOAD=/tmp/libdeny-net.so timeout 240 /tmp/local-model-smoke /tmp/qwen.gguf
  private-offline-apk:
    needs: [existing-voice-regressions, offline-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: experiments/offline_voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated offline Android scaffold
        run: |
          flutter create --platforms=android --project-name greensoil_livekit_voice_experiment --org com.greensoil.experiment .
          rm -f test/widget_test.dart analysis_options.yaml
          python3 tool/prepare_android.py
          flutter pub get
      - name: Compile Android offline test APK after all gates pass
        run: flutter build apk --debug --no-pub --target-platform android-arm64
      - name: Verify identity, microphone consent and absent network permissions
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/offline-apk-badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/offline-apk-permissions.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          b=Path('/tmp/offline-apk-badging.txt').read_text()
          p=Path('/tmp/offline-apk-permissions.txt').read_text()
          assert "package: name='com.greensoil.experiment.greensoil_livekit_voice_experiment.offline'" in b
          assert 'android.permission.INTERNET' not in p
          assert 'android.permission.RECORD_AUDIO' in p
          assert 'FOREGROUND_SERVICE_MICROPHONE' not in p
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-debug.apk') as z:
              assert any(n.startswith('lib/arm64-v8a/') and 'llama' in n for n in z.namelist())
          print('Offline ARM64 APK identity and no-INTERNET permission verified')
          PY
      - name: Encrypt before private delivery
        run: |
          python3 -m pip install --quiet 'cryptography>=43,<47'
          python3 ../livekit_voice_butler/encrypt_apk.py delivery_public.pem build/app/outputs/flutter-apk/app-debug.apk /tmp/greensoil-offline-lab.apk.enc
      - uses: actions/upload-artifact@v4
        with:
          name: greensoil-offline-lab-encrypted
          path: /tmp/greensoil-offline-lab.apk.enc
          retention-days: 1
          if-no-files-found: error
