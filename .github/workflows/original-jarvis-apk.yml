name: Original Jarvis APK (upstream unchanged)
on:
  workflow_dispatch:
  push:
    branches: [original-upstream-test]
permissions:
  contents: read
jobs:
  build-original:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve original dependencies
        run: flutter pub get
      - name: Build original Android APK
        run: flutter build apk --debug
      - name: Upload original APK
        uses: actions/upload-artifact@v4
        with:
          name: original-jarvis-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
