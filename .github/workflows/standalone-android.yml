name: Jarvis Standalone Test APK
on:
  workflow_dispatch:
  push:
    branches: [standalone-test]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter environment
        run: flutter doctor -v
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-standalone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-x64
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            PACKAGE=com.greensoil.jarvis.standalone
            APK=build/app/outputs/flutter-apk/app-debug.apk
            # Boot completion is not always package-manager readiness.
            installed=0
            for attempt in 1 2 3 4; do
              adb wait-for-device
              if adb shell pm path android >/dev/null 2>&1 && adb install --no-streaming -r "$APK"; then
                installed=1
                break
              fi
              echo "Install attempt $attempt failed; retrying ADB and package manager"
              adb reconnect || true
              sleep 15
            done
            test "$installed" = 1
            adb shell pm path "$PACKAGE"
            # Ignore boot-time SystemUI and other non-app crashes.
            adb logcat -c
            adb shell monkey -p "$PACKAGE" 1
            sleep 15
            adb shell dumpsys activity activities > activity.txt || true
            adb logcat -d -v time > logcat.txt || true
            adb exec-out screencap -p > screenshot.png || true
            adb shell pidof "$PACKAGE" > app-pid.txt
            test -s app-pid.txt || { echo "App process not running"; exit 1; }
            if grep -F "Process: $PACKAGE," logcat.txt; then
              echo "Application-specific AndroidRuntime crash detected"
              exit 1
            fi
            echo "App process confirmed; startup smoke test passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-${{ matrix.api-level }}-smoke-logs
          path: |
            activity.txt
            logcat.txt
            app-pid.txt
            screenshot.png
          if-no-files-found: warn
