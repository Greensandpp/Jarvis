name: greensoil_livekit_voice_experiment
description: Isolated GreenSoil phone-local voice lab; no cloud transport.
publish_to: none
version: 0.0.2+2
environment:
  sdk: '>=3.10.7 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  llamadart: 0.20.4
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        - cpu
